# Contour boundaries are workspace packages, and the repository root states the
# architecture: kernel and platform are Contour 1, engines are Contour 2, content
# and server are Contour 3. A package cannot import what its package.json does not
# declare, which is what makes the boundary hold without anyone remembering it.
# See ADR 0004.
packages:
  - kernel
  - platform
  - engines/*
  - contracts
  - content
  - server
  - clients/*
allowBuilds:
  esbuild: set this to true or false

# pnpm blocks postinstall scripts by default, which is the right default — a
# dependency running arbitrary code at install time is how supply-chain attacks
# land. esbuild is allowed because Vite cannot start without its native binary.
# Anything added here is a deliberate exception, not a convenience.
onlyBuiltDependencies:
  - esbuild
